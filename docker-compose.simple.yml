services:
  app:
    image: node:18-alpine
    container_name: streaming-app-simple
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      # Authentication
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=$$2a$$10$$ox1/iDPv1FRYrWw3lu9fTe2NTzzLWvVCB7PSB7Orhs1OzKS/cApEW
      - SESSION_SECRET=a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456
      
      # Storage - use internal container paths
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=2147483648
      
      # Database - use internal container path
      - DATABASE_PATH=/app/data/streams.db
      
      # App
      - NEXT_PUBLIC_APP_NAME=Personal Streaming App
      - NODE_ENV=development
      
    volumes:
      # Mount the entire project but ignore node_modules
      - .:/app
      - /app/node_modules
      
    command: >
      sh -c "
        apk add --no-cache ffmpeg python3 make g++ &&
        mkdir -p /app/uploads /app/uploads/thumbnails /app/data &&
        npm install &&
        npm install sqlite &&
        npm rebuild sqlite3 &&
        npm run dev
      "