services:
  backend:
    build: ./backend
    container_name: aayush-live-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - videos_data:/data/videos
      - logos_data:/data/logos
      - hls_data:/data/hls
    networks:
      - aayush_live_net

  frontend:
    build: ./frontend
    container_name: aayush-live-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - aayush_live_net

volumes:
  videos_data:
    driver: local
  logos_data:
    driver: local
  hls_data:
    driver: local

networks:
  aayush_live_net:
    driver: bridge