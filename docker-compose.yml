# AB Streaming Software — production stack
# All secrets come from the `.env` file next to this compose file
# (never commit a real .env; see .env.example for the required variables).
services:
  app:
    build: .
    image: ab-streaming-software:latest
    container_name: ab-streaming-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Kathmandu
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-ab_streaming}
      APP_URL: ${APP_URL:-}
      PORT: 3000
      UPLOAD_DIR: /data/uploads
      DATA_DIR: /data
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-2147483648}
    volumes:
      # Persistent storage lives on the host under ${STREAM_DATA_DIR}
      # (default ./data). Uploaded videos are kept in <dir>/uploads.
      - ${STREAM_DATA_DIR:-./data}:/data
      - ${STREAM_DATA_DIR:-./data}/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-2G}